<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Викторина про школу</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    background: linear-gradient(135deg, #6a8eff 0%, #9b6aff 50%, #ff8ac1 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .card {
    background: #ffffff;
    width: 100%;
    max-width: 720px;
    border-radius: 24px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, .30);
    padding: 28px 32px 34px;
    overflow: hidden;
  }

  h1 {
    text-align: center;
    font-size: 30px;
    color: #2b2b6b;
    margin-bottom: 6px;
  }

  .subtitle {
    text-align: center;
    color: #7a7a99;
    font-size: 15px;
    margin-bottom: 18px;
  }

  /* Прогресс */
  .progress-line {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    color: #555;
    margin-bottom: 6px;
    font-weight: 600;
  }
  .bar {
    height: 10px;
    background: #eceaf7;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .bar-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #4a90d9, #7b61ff);
    transition: width .4s ease;
  }

  /* Картинка / похвала */
  .visual {
    text-align: center;
    margin-bottom: 18px;
    min-height: 170px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .visual img {
    width: 160px;
    height: 160px;
    border-radius: 50%;
    box-shadow: 0 8px 22px rgba(0, 0, 0, .18);
  }
  #praise {
    display: none;
    background: #e8fbef;
    border: 4px dashed #2ecc71;
    border-radius: 20px;
    padding: 24px 28px;
    font-size: 26px;
    font-weight: 800;
    color: #149b53;
    line-height: 1.35;
    animation: pop .35s ease;
  }
  @keyframes pop {
    from { transform: scale(.7); opacity: 0; }
    to   { transform: scale(1);  opacity: 1; }
  }

  /* Вопрос */
  .question {
    font-size: 21px;
    font-weight: 700;
    color: #222;
    text-align: center;
    margin-bottom: 18px;
    min-height: 56px;
  }

  /* Список вариантов ответов */
  ul.options { list-style: none; }
  ul.options li { margin-bottom: 10px; }

  .opt-btn {
    width: 100%;
    border: 2px solid #d9d7ea;
    background: #f8f8ff;
    color: #2c2c4a;
    font-size: 17px;
    padding: 13px 16px;
    border-radius: 14px;
    cursor: pointer;
    text-align: left;
    transition: transform .12s, background .2s, border-color .2s;
  }
  .opt-btn:hover:not(:disabled) {
    background: #eef1ff;
    border-color: #7b61ff;
    transform: translateX(5px);
  }
  .opt-btn:disabled { cursor: default; }
  .opt-btn.correct {
    background: #d6f8e3;
    border-color: #2ecc71;
    color: #149b53;
    font-weight: 700;
  }
  .opt-btn.wrong {
    background: #ffe0e0;
    border-color: #e74c3c;
    color: #c0392b;
  }

  .hint {
    text-align: center;
    font-size: 15px;
    min-height: 22px;
    margin-top: 12px;
    color: #c0392b;
    font-weight: 600;
  }
  .hint.count {
    color: #7b61ff;
    font-size: 17px;
  }

  /* Кнопки управления */
  .controls { text-align: center; margin-top: 14px; }
  .next-btn, .restart-btn {
    background: linear-gradient(90deg, #7b61ff, #4a90d9);
    color: #fff;
    border: none;
    font-size: 17px;
    font-weight: 700;
    padding: 13px 34px;
    border-radius: 14px;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(123, 97, 255, .4);
    transition: transform .12s;
  }
  .next-btn:hover, .restart-btn:hover { transform: scale(1.05); }
  .next-btn { display: none; }

  .countdown {
    margin-top: 12px;
    font-size: 15px;
    font-weight: 700;
    color: #7b61ff;
    min-height: 20px;
  }

  /* ===== Табло времени ===== */
  .time-wrap { margin-top: 20px; }

  .time-label {
    text-align: center;
    font-size: 14px;
    font-weight: 700;
    color: #555;
    margin-bottom: 6px;
    min-height: 18px;
  }
  .time-label.warn { color: #c0392b; }

  .timebar {
    height: 18px;
    background: #eceaf7;
    border-radius: 18px;
    overflow: hidden;
    border: 2px solid #ddd9f0;
  }
  .time-fill {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #2ecc71, #27ae60);
    transition: width .1s linear, background .3s;
  }
  .time-fill.mid  { background: linear-gradient(90deg, #f4b400, #f39c11); }
  .time-fill.low  { background: linear-gradient(90deg, #e74c3c, #c0392b); }
  .time-fill.stop { background: #9b9bb5; }

  .retry-btn {
    display: none;
    background: linear-gradient(90deg, #e74c3c, #ff7a59);
    color: #fff;
    border: none;
    font-size: 17px;
    font-weight: 700;
    padding: 13px 30px;
    border-radius: 14px;
    cursor: pointer;
    margin-top: 14px;
    box-shadow: 0 6px 16px rgba(231, 76, 60, .4);
    transition: transform .12s;
  }
  .retry-btn:hover { transform: scale(1.05); }

  /* ===== Экран выбора сложности ===== */
  .start-screen { text-align: center; padding: 6px 0 4px; }
  .start-pic { font-size: 64px; line-height: 1; margin-bottom: 6px; }
  .start-ask {
    font-size: 22px;
    font-weight: 800;
    color: #2b2b6b;
    margin-bottom: 18px;
  }
  .levels { display: flex; flex-direction: column; gap: 12px; }

  .level-btn {
    border: 2px solid #d9d7ea;
    background: #f8f8ff;
    border-radius: 16px;
    padding: 14px 18px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 4px;
    align-items: center;
    transition: transform .12s, box-shadow .2s;
  }
  .level-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 18px rgba(0,0,0,.14); }
  .level-btn.easy   { border-color: #2ecc71; background: #f0fff6; }
  .level-btn.medium { border-color: #f4b400; background: #fffdf0; }
  .level-btn.hard   { border-color: #e74c3c; background: #fff5f4; }

  .lvl-name { font-size: 20px; font-weight: 800; color: #2b2b6b; }
  .level-btn.easy   .lvl-name { color: #149b53; }
  .level-btn.medium .lvl-name { color: #c98a00; }
  .level-btn.hard   .lvl-name { color: #c0392b; }
  .lvl-info { font-size: 14px; color: #666; }

  .start-note {
    margin-top: 16px;
    font-size: 13px;
    color: #8b8ba7;
  }

  .final-level {
    font-size: 15px;
    color: #7b61ff;
    font-weight: 700;
    margin-bottom: 18px;
  }

  .level-back-btn {
    background: #fff;
    border: 2px solid #7b61ff;
    color: #7b61ff;
    font-size: 15px;
    font-weight: 700;
    padding: 11px 24px;
    border-radius: 14px;
    cursor: pointer;
    margin-left: 10px;
    transition: transform .12s;
  }
  .level-back-btn:hover { transform: scale(1.05); }

  /* Экран результата */
  #result {
    display: none;
    text-align: center;
    padding: 20px 0 10px;
  }
  #result .score {
    font-size: 54px;
    font-weight: 800;
    color: #7b61ff;
    margin: 10px 0;
  }
  #result p { font-size: 18px; color: #444; margin-bottom: 20px; }
  #result img { width: 170px; height: 170px; border-radius: 50%; }
</style>
</head>
<body>

<div class="card">
  <h1>📝 Викторина про школу</h1>
  <p class="subtitle">Вопросы про школу — выбери сложность и отвечай!</p>

  <!-- ЭКРАН ВЫБОРА СЛОЖНОСТИ -->
  <div id="start" class="start-screen">
    <div class="start-pic">🎯</div>
    <p class="start-ask">Выбери сложность</p>
    <div class="levels">
      <button class="level-btn easy" data-level="easy">
        <span class="lvl-name">Лёгкий</span>
        <span class="lvl-info">5 вопросов · 8 секунд на ответ</span>
      </button>
      <button class="level-btn medium" data-level="medium">
        <span class="lvl-name">Средний</span>
        <span class="lvl-info">10 вопросов · 5 секунд на ответ</span>
      </button>
      <button class="level-btn hard" data-level="hard">
        <span class="lvl-name">Сложный</span>
        <span class="lvl-info">10 вопросов · 3 секунды · штраф за ошибку</span>
      </button>
    </div>
    <p class="start-note">Вопросы перемешиваются при каждом запуске 🔄</p>
  </div>

  <div id="quiz" style="display:none">
    <div class="progress-line">
      <span id="counter">Вопрос 1 из 10</span>
      <span id="score">Очки: 0</span>
    </div>
    <div class="bar"><div class="bar-fill" id="barFill"></div></div>

    <div class="visual">
      <img id="mascot" alt="Смайлик"
           src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240' viewBox='0 0 240 240'><circle cx='120' cy='120' r='112' fill='%23fff3c4' stroke='%23f4b400' stroke-width='6'/><rect x='52' y='58' width='136' height='104' rx='12' fill='%234a90d9'/><rect x='60' y='66' width='56' height='88' rx='7' fill='%23eaf3ff'/><rect x='124' y='66' width='56' height='88' rx='7' fill='%23eaf3ff'/><rect x='116' y='58' width='8' height='104' fill='%232f6fb5'/><circle cx='95' cy='192' r='10' fill='%23333333'/><circle cx='145' cy='192' r='10' fill='%23333333'/><path d='M92 214 Q120 240 148 214' stroke='%23333333' stroke-width='8' fill='none' stroke-linecap='round'/><circle cx='68' cy='205' r='9' fill='%23ff9db0'/><circle cx='172' cy='205' r='9' fill='%23ff9db0'/></svg>">
      <div id="praise">Молодец, все правильно! 🎉</div>
    </div>

    <p class="question" id="questionText"></p>

    <ul class="options" id="optionsList"></ul>

    <p class="hint" id="hint"></p>

    <div class="controls">
      <button class="next-btn" id="nextBtn">Дальше →</button>
      <button class="retry-btn" id="retryBtn">🔁 Попробовать снова</button>
      <p class="countdown" id="countdown"></p>
    </div>

    <!-- ТАБЛО ВРЕМЕНИ -->
    <div class="time-wrap">
      <p class="time-label" id="timeLabel"></p>
      <div class="timebar"><div class="time-fill" id="timeFill"></div></div>
    </div>
  </div>

  <div id="result">
    <img alt="Победа"
         src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240' viewBox='0 0 240 240'><circle cx='120' cy='120' r='112' fill='%23e8fbef' stroke='%232ecc71' stroke-width='6'/><path d='M70 96 L104 96 L120 62 L136 96 L170 96 L148 122 L156 158 L120 138 L84 158 L92 122 Z' fill='%23f4b400' stroke='%23d99400' stroke-width='4' stroke-linejoin='round'/><circle cx='104' cy='186' r='9' fill='%23333333'/><circle cx='136' cy='186' r='9' fill='%23333333'/><path d='M104 206 Q120 226 136 206' stroke='%23333333' stroke-width='7' fill='none' stroke-linecap='round'/></svg>">
    <div class="score" id="finalScore">0 / 10</div>
    <p id="finalText"></p>
    <p class="final-level" id="finalLevel"></p>
    <button class="restart-btn" id="restartBtn">🔄 Ещё раз</button>
    <button class="level-back-btn" id="levelBtn">🎚 Сменить сложность</button>
  </div>
</div>

<script>
  // ===== ДАННЫЕ: список словарей (вопрос -> варианты -> правильный ответ) =====
  const QUIZ = [
    { question: "Как называется человек, который руководит школой?",
      options: ["Директор", "Библиотекарь", "Охранник", "Повар", "Уборщик"], correct: 0 },

    { question: "Где ученики берут книги, чтобы читать дома?",
      options: ["Столовая", "Библиотека", "Спортзал", "Актовый зал", "Кабинет информатики"], correct: 1 },

    { question: "Сколько минут длится обычно один урок?",
      options: ["15 минут", "25 минут", "35 минут", "45 минут", "60 минут"], correct: 3 },

    { question: "Какой предмет изучает таблицу Менделеева?",
      options: ["Математика", "История", "Химия", "География", "Литература"], correct: 2 },

    { question: "Какой предмет изучает карты, страны и материки?",
      options: ["Биология", "География", "Физика", "Английский язык", "Музыка"], correct: 1 },

    { question: "Как называется каждая из четырёх частей учебного года?",
      options: ["Пятиминутка", "Четверть", "Смена", "Дежурство", "Контрольная"], correct: 1 },

    { question: "Сколько букв в русском алфавите?",
      options: ["25", "28", "31", "33", "36"], correct: 3 },

    { question: "Где ученики обедают в школе?",
      options: ["В столовой", "В мастерской", "В лаборатории", "В рекреации", "В подсобной комнате"], correct: 0 },

    { question: "На каком уроке ученики занимаются на турниках и играют в мяч?",
      options: ["Труд", "Физкультура", "Рисование", "Ботаника", "Чтение"], correct: 1 },

    { question: "Как называется праздник 1 сентября?",
      options: ["Новый год", "День учителя", "День знаний", "Последний звонок", "Масленица"], correct: 2 }
  ];

  // ===== СЛОЖНОСТИ (словарь настроек) =====
  const LEVELS = {
    easy:   { name: "Лёгкий",   count: 5,  time: 8, penalty: 0 },
    medium: { name: "Средний",  count: 10, time: 5, penalty: 0 },
    hard:   { name: "Сложный",  count: 10, time: 3, penalty: 1 }
  };

  // ===== ЛОГИКА =====
  let TOTAL = 10;     // сколько вопросов в этом запуске
  let deck = [];      // перемешанные вопросы этого запуска
  let level = null;   // выбранная сложность (ключ словаря LEVELS)
  let current = 0;    // номер вопроса
  let score = 0;      // очки
  let locked = false; // зафиксирован ли ответ в текущем вопросе

  // Перемешивание списка (алгоритм Фишера — Йетса)
  function shuffle(list) {
    const arr = list.slice();
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = arr[i];
      arr[i] = arr[j];
      arr[j] = tmp;
    }
    return arr;
  }

  // Новый раздающийся набор вопросов + варианты ответов тоже перемешиваются
  function buildDeck(key) {
    level = key;
    const conf = LEVELS[key];
    deck = shuffle(QUIZ).slice(0, conf.count).map(function (item) {
      const order = shuffle(item.options.map(function (text, idx) {
        return { text: text, correct: idx === item.correct };
      }));
      return {
        question: item.question,
        options: order.map(function (o) { return o.text; }),
        correct: order.findIndex(function (o) { return o.correct; })
      };
    });
    TOTAL = deck.length;
  }

  const startBox    = document.getElementById("start");
  const finalLevel  = document.getElementById("finalLevel");
  const levelBtn    = document.getElementById("levelBtn");
  const timeFill    = document.getElementById("timeFill");
  const timeLabel   = document.getElementById("timeLabel");
  const retryBtn    = document.getElementById("retryBtn");

  const questionText = document.getElementById("questionText");
  const optionsList  = document.getElementById("optionsList");
  const counter      = document.getElementById("counter");
  const scoreEl      = document.getElementById("score");
  const barFill      = document.getElementById("barFill");
  const hint         = document.getElementById("hint");
  const nextBtn      = document.getElementById("nextBtn");
  const countdown    = document.getElementById("countdown");
  const mascot       = document.getElementById("mascot");
  const praise       = document.getElementById("praise");
  const quizBox      = document.getElementById("quiz");
  const resultBox    = document.getElementById("result");
  const finalScore   = document.getElementById("finalScore");
  const finalText    = document.getElementById("finalText");
  const restartBtn   = document.getElementById("restartBtn");

  // ===== Таймеры: табло времени и автопереход =====
  const TICK = 100;          // как часто обновляется полоска, мс
  let answerTimer = null;    // табло времени на ответ
  let autoTimer = null;      // таймер перехода
  let tickTimer = null;      // таймер обратного отсчёта
  let timeTotal = 5000;      // всего мс на ответ
  let timeLeft = 5000;       // сколько мс осталось

  function stopTimers() {
    clearTimeout(autoTimer);
    clearInterval(tickTimer);
    clearInterval(answerTimer);
    autoTimer = null;
    tickTimer = null;
    answerTimer = null;
  }

  // ТАБЛО: полоска уменьшается, пока идёт время на ответ
  function startAnswerTimer() {
    stopTimers();
    timeTotal = LEVELS[level].time * 1000;
    timeLeft = timeTotal;
    paintTimebar();

    answerTimer = setInterval(function () {
      timeLeft -= TICK;
      if (timeLeft <= 0) {
        timeLeft = 0;
        paintTimebar();
        timeIsUp();          // время истекло
        return;
      }
      paintTimebar();
    }, TICK);
  }

  function paintTimebar() {
    const part = timeTotal > 0 ? (timeLeft / timeTotal) : 0;
    timeFill.style.width = (part * 100) + "%";
    timeFill.className = "time-fill";
    if (part <= 0.25) timeFill.classList.add("low");
    else if (part <= 0.5) timeFill.classList.add("mid");

    const sec = Math.ceil(timeLeft / 1000);
    timeLabel.textContent = "Осталось времени: " + sec + " сек.";
    timeLabel.className = "time-label" + (sec <= 2 ? " warn" : "");
  }

  // Время вышло: кнопки выключаются, появляется «Попробовать снова»
  function timeIsUp() {
    stopTimers();
    locked = true;
    document.querySelectorAll(".opt-btn").forEach(function (b) { b.disabled = true; });

    timeFill.classList.add("stop");
    timeLabel.textContent = "Время вышло!";
    timeLabel.className = "time-label warn";

    hint.style.color = "#c0392b";
    hint.textContent = "Время вышло! Попробуй ещё раз.";
    retryBtn.style.display = "inline-block";
  }

  function startAutoAdvance() {
    stopTimers();
    const delay = LEVELS[level].time;   // секунд на обдумывание
    let left = delay;
    countdown.textContent = "Следующий вопрос через " + left + " сек.";

    tickTimer = setInterval(function () {
      left--;
      if (left > 0) {
        countdown.textContent = "Следующий вопрос через " + left + " сек.";
      } else {
        countdown.textContent = "Переходим!";
      }
    }, 1000);

    autoTimer = setTimeout(function () {
      stopTimers();
      next();
    }, delay * 1000);
  }

  // Показать текущий вопрос
  function renderQuestion() {
    const item = deck[current];
    locked = false;
    stopTimers();
    countdown.textContent = "";
    retryBtn.style.display = "none";

    counter.textContent = "Вопрос " + (current + 1) + " из " + TOTAL;
    scoreEl.textContent = "Очки: " + score;
    barFill.style.width = (current / TOTAL * 100) + "%";
    questionText.textContent = item.question;
    hint.textContent = "";
    nextBtn.style.display = "none";

    // картинка видна, похвала скрыта
    mascot.style.display = "inline-block";
    praise.style.display = "none";

    // строим СПИСОК вариантов ответов
    optionsList.innerHTML = "";
    item.options.forEach(function (text, i) {
      const li = document.createElement("li");
      const btn = document.createElement("button");
      btn.className = "opt-btn";
      btn.textContent = (i + 1) + ". " + text;
      btn.addEventListener("click", function () { check(btn, i); });
      li.appendChild(btn);
      optionsList.appendChild(li);
    });

    // запускаем табло времени на этот вопрос
    startAnswerTimer();
  }

  // Проверка ответа
  function check(btn, choice) {
    if (locked) return;
    const correctIndex = deck[current].correct;

    if (choice === correctIndex) {
      locked = true;
      btn.classList.add("correct");
      score++;
      scoreEl.textContent = "Очки: " + score;

      // ПРАВИЛЬНЫЙ ОТВЕТ: картинка меняется на надпись
      mascot.style.display = "none";
      praise.style.display = "block";

      // табло останавливается — время сохранено
      stopTimers();
      timeFill.style.width = "100%";
      timeFill.className = "time-fill";
      timeLabel.textContent = "Ответ принят!";
      timeLabel.className = "time-label";

      // выключаем остальные кнопки
      document.querySelectorAll(".opt-btn").forEach(function (b) { b.disabled = true; });

      hint.style.color = "#149b53";
      hint.textContent = "Правильный ответ!";
      nextBtn.style.display = "inline-block";
      nextBtn.textContent = (current === TOTAL - 1) ? "Показать результат →" : "Дальше →";

      // через N секунд вопрос меняется на следующий
      startAutoAdvance();
    } else {
      btn.classList.add("wrong");
      btn.disabled = true;

      // на сложном уровне — минус очко за ошибку (не уходит в минус)
      let extra = "";
      if (LEVELS[level].penalty > 0) {
        score = Math.max(0, score - LEVELS[level].penalty);
        scoreEl.textContent = "Очки: " + score;
        extra = " −" + LEVELS[level].penalty + " очко";
      }

      hint.style.color = "#c0392b";
      hint.textContent = "Неверно, попробуй ещё раз!" + extra;
    }
  }

  // Следующий вопрос или результат
  function next() {
    stopTimers();
    countdown.textContent = "";
    current++;
    if (current < TOTAL) {
      renderQuestion();
    } else {
      showResult();
    }
  }

  function showResult() {
    quizBox.style.display = "none";
    resultBox.style.display = "block";
    finalScore.textContent = score + " / " + TOTAL;
    finalLevel.textContent = "Сложность: " + LEVELS[level].name +
      " · время на ответ " + LEVELS[level].time + " сек.";

    const part = score / TOTAL;   // доля правильных ответов
    if (part === 1) {
      finalText.textContent = "Идеально! Молодец, все правильно! 🎉";
    } else if (part >= 0.7) {
      finalText.textContent = "Отличный результат! Ты много знаешь о школе. 👍";
    } else if (part >= 0.4) {
      finalText.textContent = "Неплохо! А попробуй пройти ещё раз. 🙂";
    } else {
      finalText.textContent = "Стоит повторить уроки и попробовать снова. 📚";
    }
  }

  // Начать игру с выбранной сложностью (вопросы каждый раз новые)
  function startGame(key) {
    stopTimers();
    buildDeck(key);          // перемешанные вопросы + перемешанные варианты
    current = 0;
    score = 0;
    startBox.style.display = "none";
    resultBox.style.display = "none";
    quizBox.style.display = "block";
    renderQuestion();
  }

  // Вернуться к выбору сложности
  function showStart() {
    stopTimers();
    quizBox.style.display = "none";
    resultBox.style.display = "none";
    startBox.style.display = "block";
  }

  // То же, но с новым перемешиванием
  function restart() {
    startGame(level);
  }

  nextBtn.addEventListener("click", next);
  restartBtn.addEventListener("click", restart);
  levelBtn.addEventListener("click", showStart);

  // «Попробовать снова» — тот же вопрос, время заново
  retryBtn.addEventListener("click", function () {
    renderQuestion();
  });

  // Кнопки выбора сложности на стартовом экране
  document.querySelectorAll(".level-btn").forEach(function (btn) {
    btn.addEventListener("click", function () {
      startGame(btn.dataset.level);
    });
  });

</script>
</body>
</html>
